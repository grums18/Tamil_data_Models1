[theme]
primaryColor = "#ff6b35"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = true

[logger]
level = "debug"

[server]
port = 7860
headless = true
runOnSave = true
maxUploadSize = 200
enableXsrfProtection = true
